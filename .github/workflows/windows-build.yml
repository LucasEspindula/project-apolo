name: Windows CMake build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: MSVC Release x64
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Confirm executable
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'build/Release/Apolo.exe')) {
            throw 'Apolo.exe nao foi gerado.'
          }
          Get-FileHash 'build/Release/Apolo.exe' -Algorithm SHA256
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: apolo-windows-x64-piloto
          path: build/Release/Apolo.exe
          if-no-files-found: error
